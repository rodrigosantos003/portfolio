name: Update Dependencies

on:
  schedule:
    - cron: "0 1 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-deps:
    name: Update dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "yarn"

      - name: Enable Corepack (ensures correct Yarn version)
        run: corepack enable

      - name: Install current dependencies
        run: yarn install --immutable

      - name: Upgrade dependencies to latest allowed versions
        run: yarn upgrade --latest

      - name: Reinstall to refresh lockfile
        run: yarn install

      - name: Run lint
        run: yarn lint --if-present

      - name: Run build to verify Next.js app still compiles
        run: yarn build

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- package.json yarn.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json yarn.lock
          git commit -m "chore: Update dependencies"
          git push
